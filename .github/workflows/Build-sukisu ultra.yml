name: Kernel Build Workflow

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model to build (leave empty to build all)"
        required: false
        default: "all"
        type: choice
        options:
        - all
        - d1
        - d1xks
        - d2s
        - d2x
        - d2xks

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      should_build_all: ${{ github.event.inputs.model == 'all' }}
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig
      - name: Set should_build_all output
        run: echo "should_build_all=${{ github.event.inputs.model == 'all' }}" >> $GITHUB_OUTPUT

  build_d1:
    needs: setup
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.model == 'd1' || needs.setup.outputs.should_build_all == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Update submodules
        run: |
          git submodule update --init --recursive
          git submodule update --remote
      - name: Build for d1
        run: ./workflows.sh -m d1 -k Y -r N
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeKRNL-Nexus-d1
          path: build/out/d1/zip

  build_d1xks:
    needs: setup
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.model == 'd1xks' || needs.setup.outputs.should_build_all == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Update submodules
        run: |
          git submodule update --init --recursive
          git submodule update --remote
      - name: Build for d1xks
        run: ./workflows.sh -m d1xks -k Y -r N
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeKRNL-Nexus-d1xks
          path: build/out/d1xks/zip

  build_d2s:
    needs: setup
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.model == 'd2s' || needs.setup.outputs.should_build_all == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.FCK_SUBMODULES }}
      - name: Update submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive --remote
      - name: Build for d2s
        run: ./workflows.sh -m d2s -k Y -r N
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeKRNL-Nexus-d2s
          path: build/out/d2s/zip

  build_d2x:
    needs: setup
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.model == 'd2x' || needs.setup.outputs.should_build_all == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Update submodules
        run: |
          git submodule update --init --recursive
          git submodule update --remote
      - name: Build for d2x
        run: ./workflows.sh -m d2x -k Y -r N
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeKRNL-Nexus-d2x
          path: build/out/d2x/zip

  # =========================================================================
  # JOB DÀNH RIÊNG CHO D2XKS (NOTE 10+ 5G HÀN QUỐC) - TÍCH HỢP SUKISU ULTRA
  # =========================================================================
  build_d2xks:
    needs: setup
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.model == 'd2xks' || needs.setup.outputs.should_build_all == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          
      - name: Update submodules
        run: |
          git submodule update --init --recursive
          git submodule update --remote

      - name: Integrate SukiSU Ultra & Patch Configs
        run: |
          echo "=> 1. Tích hợp SukiSU Ultra..."
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s nongki
          
          echo "=> 2. Vá lỗi SELinux..."
          sed -i 's/static const struct file_operations sel_write_op/const struct file_operations sel_write_op/' security/selinux/selinuxfs.c
          echo 'EXPORT_SYMBOL(sel_write_op);' >> security/selinux/selinuxfs.c
          sed -i 's/static const struct file_operations sel_handle_status_ops/const struct file_operations sel_handle_status_ops/' security/selinux/selinuxfs.c
          echo 'EXPORT_SYMBOL(sel_handle_status_ops);' >> security/selinux/selinuxfs.c
          sed -i 's/static int security_dump_masked_av/int security_dump_masked_av/' security/selinux/ss/services.c
          echo 'EXPORT_SYMBOL(security_dump_masked_av);' >> security/selinux/ss/services.c
          sed -i 's/static int context_struct_compute_av/int context_struct_compute_av/' security/selinux/ss/services.c
          echo 'EXPORT_SYMBOL(context_struct_compute_av);' >> security/selinux/ss/services.c
          
          echo "=> 3. Bơm CONFIG driver vào defconfig..."
          DEFCONFIG_FILE="exynos9820-d2xks_defconfig"
          cat >> arch/arm64/configs/$DEFCONFIG_FILE << 'EOF'
          CONFIG_DEBUG_SNAPSHOT=y
          CONFIG_EXYNOS_ADV_TRACER=y
          CONFIG_EXYNOS_CPUHP=y
          CONFIG_SCHED_FRT=y
          CONFIG_RTC_LIB=y
          CONFIG_LCD_CLASS_DEVICE=y
          CONFIG_MALI_EXYNOS=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          # CONFIG_KPROBES is not set
          EOF

      - name: Build for d2xks with SukiSU
        # Đổi -k Y thành -k N để tắt KSU Next mặc định, tránh xung đột với SukiSU
        run: ./workflows.sh -m d2xks -k N -r N

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeKRNL-Nexus-d2xks-SukiSU
          path: build/out/d2xks/zip
